<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title description">
  <title id="title">PropertyIQ planned baseline RAG architecture</title>
  <desc id="description">Fictional PDF and DOCX documents pass through ingestion and processing into PostgreSQL. Next.js sends manager questions to a server-side orchestrator. The baseline orchestrator calls the evidence retrieval tool once, coordinates answer generation and citation validation, and returns the result to the UI. Opening a source re-checks property access.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #1e293b; }
    .boundary { fill: #f8fafc; stroke: #cbd5e1; stroke-dasharray: 6 5; }
    .heading { font-size: 15px; font-weight: 700; fill: #475569; }
    .node rect { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .shared rect { fill: #eef2f6; stroke: #64748b; }
    .actor rect { fill: #e2e8f0; stroke: #64748b; }
    .node text { font-size: 14px; text-anchor: middle; }
    .node .title { font-size: 17px; font-weight: 700; }
    .edge { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
    .lookup { stroke-dasharray: 5 5; }
    .both { marker-start: url(#arrow); }
    .label { fill: #475569; font-size: 12px; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="840" fill="#ffffff"/>
  <text x="40" y="32" font-size="23" font-weight="700">PropertyIQ / Baseline architecture</text>
  <text x="1160" y="31" text-anchor="end" font-size="13" fill="#475569">Planned system</text>
  <g transform="translate(0 35)">
    <rect class="boundary" x="30" y="30" width="840" height="185" rx="16"/>
    <text class="heading" x="55" y="62">01 / Document preparation</text>
    <rect class="boundary" x="320" y="305" width="835" height="320" rx="16"/>
    <text class="heading" x="345" y="337">02 / Orchestrated baseline RAG - server-side workflow</text>

    <path id="documents-ingestion" class="edge" d="M 290 140 H 340"/>
    <path id="ingestion-processing" class="edge" d="M 570 140 H 620"/>
    <path id="processing-storage" class="edge" d="M 850 140 H 900"/>
    <path id="manager-ui" class="edge" d="M 175 310 V 365"/>
    <path id="ui-orchestrator" class="edge" d="M 290 400 H 340"/>
    <path id="orchestrator-retrieval" class="edge" d="M 570 400 H 620"/>
    <path id="retrieval-orchestrator" class="edge" d="M 620 440 H 570"/>
    <path id="retrieval-storage" class="edge both" d="M 735 365 V 265 H 975 V 195"/>
    <path id="orchestrator-generation" class="edge" d="M 455 465 V 550 H 620"/>
    <path id="generation-validation" class="edge" d="M 850 550 H 900"/>
    <path id="validation-storage" class="edge lookup" d="M 1060 500 V 195"/>
    <path id="validation-orchestrator" class="edge" d="M 1015 600 V 615 H 480 V 465"/>
    <path id="orchestrator-ui" class="edge" d="M 340 440 H 290"/>
    <path id="ui-sources" class="edge both" d="M 175 465 V 630"/>
    <path id="sources-storage" class="edge lookup" d="M 340 680 H 1175 V 140 H 1130"/>

    <text class="label" x="850" y="255">One filtered search / matching evidence</text>
    <text class="label" x="730" y="608">Validated answer or verification status</text>
    <text class="label" x="530" y="535">Retrieved evidence</text>
    <text class="label" x="175" y="600">Open citation / excerpt</text>
    <text class="label" x="750" y="670">Resolve source and re-check property access</text>
    <text class="label" x="1095" y="420">Verify</text>
    <text class="label" x="1095" y="437">citations</text>

    <g id="documents" class="node">
      <rect x="60" y="95" width="230" height="90" rx="10"/>
      <text x="175" y="129" class="title">Property documents</text>
      <text x="175" y="155">Fictional PDF / DOCX</text>
    </g>
    <g id="ingestion" class="node">
      <rect x="340" y="95" width="230" height="90" rx="10"/>
      <text x="455" y="129" class="title">Document ingestion</text>
      <text x="455" y="155">Property + version metadata</text>
    </g>
    <g id="processing" class="node">
      <rect x="620" y="95" width="230" height="90" rx="10"/>
      <text x="735" y="125" class="title">Document processing</text>
      <text x="735" y="149">Text, passages, embeddings</text>
      <text x="735" y="171">Source locations</text>
    </g>
    <g id="storage" class="node shared">
      <rect x="900" y="85" width="230" height="110" rx="16"/>
      <text x="1015" y="116" class="title">Shared storage</text>
      <text x="1015" y="141">PostgreSQL</text>
      <text x="1015" y="163">Documents + searchable evidence</text>
      <text x="1015" y="183">Versions + permissions</text>
    </g>
    <g id="manager" class="node actor">
      <rect x="60" y="230" width="230" height="80" rx="40"/>
      <text x="175" y="263" class="title">Property manager</text>
      <text x="175" y="287">Questions and evidence review</text>
    </g>
    <g id="ui" class="node shared">
      <rect x="60" y="365" width="230" height="100" rx="10"/>
      <text x="175" y="395" class="title">Manager UI</text>
      <text x="175" y="420">Next.js</text>
      <text x="175" y="445">Questions, answers, citations</text>
    </g>
    <g id="orchestrator" class="node shared">
      <rect x="340" y="365" width="230" height="100" rx="10"/>
      <text x="455" y="395" class="title">Orchestrator / Agent</text>
      <text x="455" y="421">Calls retrieval; coordinates answer</text>
      <text x="455" y="445">Fixed baseline workflow</text>
    </g>
    <g id="retrieval" class="node">
      <rect x="620" y="365" width="230" height="100" rx="10"/>
      <text x="735" y="395" class="title">Evidence retrieval tool</text>
      <text x="735" y="421">One search</text>
      <text x="735" y="445">Authorised + current only</text>
    </g>
    <g id="generation" class="node">
      <rect x="620" y="500" width="230" height="100" rx="10"/>
      <text x="735" y="530" class="title">Answer generation</text>
      <text x="735" y="556">Question + retrieved evidence</text>
      <text x="735" y="580">Flag gaps and conflicts</text>
    </g>
    <g id="validation" class="node">
      <rect x="900" y="500" width="230" height="100" rx="10"/>
      <text x="1015" y="530" class="title">Citation validation</text>
      <text x="1015" y="556">Source, access and version</text>
      <text x="1015" y="580">Withhold unverifiable drafts</text>
    </g>
    <g id="sources" class="node">
      <rect x="60" y="630" width="280" height="100" rx="10"/>
      <text x="200" y="663" class="title">Source viewing</text>
      <text x="200" y="689">Fresh server-side property access check</text>
      <text x="200" y="713">Passage + available page reference</text>
    </g>
    <text class="heading" x="60" y="780">Illustrative data flow, not live activity or deployment topology.</text>
  </g>
</svg>
